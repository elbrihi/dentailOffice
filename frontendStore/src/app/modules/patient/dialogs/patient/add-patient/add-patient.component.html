<div class="patient-container mat-elevation-z4">
    <h2 class="patient-title">Les information de patient</h2>
    <form class="patient-form" [formGroup]="FormPatientBuilder" (ngSubmit)="addPatient($event)">
        <div class="mat-form-fields">

            <mat-form-field appearance="outline"  class="form-field">
                <mat-label>Le nom de patient</mat-label>
                <input matInput formControlName="firstName" />
            </mat-form-field>

            <mat-form-field appearance="outline" class="form-field">
                <mat-label>Nom de famille</mat-label>
                <input matInput formControlName="lastName" />
            </mat-form-field>

            <mat-form-field appearance="outline" class="form-field">
                <mat-label>Email</mat-label>
                <input matInput formControlName="email" />
            </mat-form-field> 

            <mat-form-field appearance="outline" class="form-field">
                <mat-label>Cni</mat-label>
                <input matInput formControlName="cni" />
            </mat-form-field> 

            <mat-form-field appearance="outline" class="form-field">
                <mat-label>Téléphone</mat-label>
                <input matInput formControlName="phone" />
            </mat-form-field>

            <mat-form-field appearance="outline" class="form-field">
            <mat-label>La date de naissance</mat-label>
                <input matInput [matDatepicker]="picker" formControlName="birthDate">
                <mat-hint>MM/DD/YYYY</mat-hint>
                <mat-datepicker-toggle matIconSuffix [for]="picker">
                    <mat-icon matDatepickerToggleIcon>keyboard_arrow_down</mat-icon>
                </mat-datepicker-toggle>
                <mat-datepicker #picker></mat-datepicker>
            </mat-form-field>

            <mat-form-field appearance="outline" class="form-field">
                <mat-label>sexe</mat-label>
                <input matInput  formControlName="gender"   />
            </mat-form-field>

            <mat-form-field appearance="outline" class="form-field">
                <mat-label>Groupe sanguin</mat-label>
                <input matInput  formControlName="bloodType"   />
            </mat-form-field>


            <mat-form-field appearance="outline" class="form-field">
                <mat-label>Adresse</mat-label>
                <input matInput  formControlName="address"   />
            </mat-form-field>


            <mat-form-field appearance="outline" class="form-field">
                <mat-label>Notes</mat-label>
                <input matInput formControlName="notes"   type="tel" />
            </mat-form-field>

            <mat-form-field appearance="outline" class="form-field">
                <mat-label>medicalHistory</mat-label>
                <input matInput formControlName="medicalHistory"   type="tel" />
            </mat-form-field>

        </div>

        <div class="form-actions">
            <button mat-raised-button color="primary" 
            
            [disabled]="FormPatientBuilder.invalid"
            
            >Enregistrer</button>
            <button mat-raised-button (click)="cancelAdding()" color="warn">Cancel</button>
        </div>
    </form>
  </div>
