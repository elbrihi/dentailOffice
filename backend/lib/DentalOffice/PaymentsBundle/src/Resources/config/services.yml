services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false


    DentalOffice\PaymentsBundle\Infrastructure\Persistence\Doctrine\Processor\State\PaymentPostProcessor:
        arguments:
            - '@api_platform.doctrine.orm.state.persist_processor'
            - '@api_platform.doctrine.orm.state.remove_processor'
            - '@api_platform.validator'

    DentalOffice\PaymentsBundle\Domain\Repository\PaymentRepository:
        tags:
            - { name: 'doctrine.repository_service' }
        arguments:
            - '@doctrine'
